<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>內布隆防具 - 選項變換模擬器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-color: #121218;
        --panel-bg: #1e1e26;
        --slot-bg: #2a2a35;
        --border-color: #333340;
        --primary-color: #00e5ff;
        --accent-color: #ffd700;
        --text-main: #e0e0e0;
        --text-sub: #a0a0b0;
        --max-stat-color: #d3ab82; 
        --min-stat-color: #757575;
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Noto Sans TC", sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    /* 容器佈局 */
    .container {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 20px;
        width: 100%;
        max-width: 900px;
    }

    /* 左側：裝備面板 */
    .weapon-panel {
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        position: relative;
    }

    .panel-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid var(--border-color);
    }

    .item-image {
        width: 64px;
        height: 64px;
        border-radius: 8px;
        border: 2px solid var(--primary-color);
        background: #000;
        object-fit: cover;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    .item-info h2 {
        margin: 0;
        font-size: 1.2rem;
        color: #f16605; 
    }

    .item-info span {
        font-size: 0.9rem;
        color: var(--text-sub);
    }

    /* 屬性槽位 */
    .slots-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex-grow: 1;
        margin-bottom: 20px;
    }

    .option-slot {
        background: var(--slot-bg);
        padding: 12px 15px;
        border-radius: 6px;
        border: 1px solid transparent;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.95rem;
        transition: all 0.2s;
        min-height: 50px;
    }
    
    .option-slot:hover {
        border-color: #555;
    }

    .option-name {
        flex: 1;
    }

    .score-tag {
        background: rgba(0, 229, 255, 0.15);
        color: var(--primary-color);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.85rem;
        font-weight: bold;
        margin-left: 10px;
        white-space: nowrap;
    }

    /* 左側面板底部的總分區塊 */
    .panel-footer {
        border-top: 1px solid var(--border-color);
        padding-top: 15px;
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .total-score-label {
        font-size: 1rem;
        color: var(--text-sub);
        font-weight: bold;
    }

    .total-score-value {
        font-size: 1.8rem;
        font-weight: bold;
        color: var(--primary-color);
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        font-family: 'Consolas', monospace;
    }

    /* 右側：控制與數據 */
    .control-panel {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    /* 數據儀表板 */
    .stats-card {
        background: var(--panel-bg);
        border-radius: 12px;
        padding: 20px;
        border: 1px solid var(--border-color);
    }

    /* 統計圖片佔位 */
    .stats-image-placeholder {
        width: 48px;
        height: 48px;
        border-radius: 8px;
        border: 2px solid var(--primary-color);
        background: #000;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .stats-image-placeholder img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        font-size: 0.95rem;
    }

    .stat-row:last-child { margin-bottom: 0; }

    .stat-label { 
        color: var(--text-sub); 
        display: flex;
        align-items: center;
        gap: 5px;
    }
    
    .stat-value { 
        font-weight: bold; 
        color: #fff;
        font-family: 'Consolas', monospace;
    }

    .stat-value.highlight { color: var(--accent-color); font-size: 1.1rem; }
    
    .rate-info {
        font-size: 0.75rem;
        color: #666;
        font-weight: normal;
    }
    
    /* 設定區 */
    .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0,0,0,0.2);
        padding: 10px;
        border-radius: 8px;
        margin-top: 15px;
        font-size: 0.9rem;
    }

    .settings-row input {
        background: transparent;
        border: none;
        border-bottom: 1px solid var(--text-sub);
        color: var(--accent-color);
        width: 55px;
        text-align: right;
        font-size: 1rem;
        font-weight: bold;
    }
    .settings-row input:focus { outline: none; border-bottom-color: var(--accent-color); }
	
    /* 統計標題區塊 */
    .stats-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px dashed var(--border-color);
    }
    
    /* 統計標題文字 */
    .stats-title {
        color: #39ff14; 
        font-weight: bold;
        font-size: 1.1rem;
        text-shadow: 0 0 8px rgba(57, 255, 20, 0.4);
    }

    /* 按鈕群組 */
    .buttons-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    button {
        border: none;
        padding: 15px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.1s, filter 0.2s;
        position: relative;
        overflow: hidden;
    }

    button:active { transform: scale(0.98); }

    .btn-roll {
        background: linear-gradient(135deg, var(--primary-color), #00b0ff);
        color: #000;
        box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
    }

    .btn-search {
        background: rgba(255, 215, 0, 0.1);
        color: var(--accent-color);
        border: 1px solid var(--accent-color);
    }
    .btn-search:hover { background: rgba(255, 215, 0, 0.2); }

    .btn-reset {
        background: transparent;
        color: var(--text-sub);
        border: 1px dashed var(--border-color);
        margin-top: 10px;
    }
    .btn-reset:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        border-color: #666;
    }

    /* 底部連結區塊 */
    .footer-links {
        margin-top: 25px;
        text-align: center;
        width: 100%;
    }

    .footer-links a {
        color: #666;
        text-decoration: none;
        font-size: 0.85rem;
        transition: color 0.2s;
    }

    .footer-links a:hover {
        color: #a0a0b0;
        text-decoration: underline;
    }

    /* RWD */
    @media (max-width: 768px) {
        .container { grid-template-columns: 1fr; }
        .weapon-panel { min-height: auto; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="weapon-panel">
        <div class="panel-header">
            <img src="https://raw.githubusercontent.com/add1010751/Nebulon-Suit-Armor/refs/heads/main/%E5%85%A7%E5%B8%83%E9%9A%86%E9%98%B2%E5%85%B7.webp" class="item-image" alt="裝備圖片">
            <div class="item-info">
                <h2>內布隆防具</h2>
                <span>屬性變更模擬</span>
            </div>
        </div>

        <div id="result" class="slots-container">
            <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
            <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
            <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
        </div>

        <div class="panel-footer">
            <span class="total-score-label">裝備總評分</span>
            <span id="total-score" class="total-score-value">0.0</span>
        </div>
    </div>

    <div class="control-panel">
        <div class="stats-card">
            
            <!-- 統計圖片位置-->
             <div class="stats-header">
                <div class="stats-image-placeholder">
                    <img src="https://raw.githubusercontent.com/add1010751/Nebulon-Suit-Armor/refs/heads/main/%E9%98%B2%E5%85%B7%E5%B1%AC%E6%80%A7%E8%AE%8A%E6%8F%9B%E7%9F%B3.webp" alt="統計圖片">
                </div>
                <div class="stats-title">防具屬性變換石</div>
            </div>

            <div class="stat-row">
                <span class="stat-label">變換次數</span>
                <span id="click-count" class="stat-value">0</span>
            </div>
            <!-- 移除ED計算，改為固定台幣 -->
            <div class="stat-row">
                <span class="stat-label">台幣估算 (單次29NT)</span>
                <span class="stat-value highlight">NT$ <span id="ed-twd">0</span></span>
            </div>
            <div class="stat-row">
                <span class="stat-label">
                    港幣估算
                    <span id="rate-display" class="rate-info">
                        (讀取匯率中...)
                    </span>
                </span>
                <span class="stat-value">HK$ <span id="ed-hkd">0</span></span>
            </div>

            <!-- 改為自訂分數設定區 -->
            <div class="settings-row">
                <span>目標分數</span>
                <div>
                    <input id="target-score" type="number" step="0.1" value="0"> 分
                </div>
            </div>
        </div>

        <div class="buttons-group">
            <button class="btn-roll" onclick="wrapAction(getRandomOptions)">
                🎲 單次變換
            </button>
            <button class="btn-search" onclick="wrapAction(findCustomTargetOptions)">
                🔍 [停用]搜尋目標分數
            </button>
            <button class="btn-reset" onclick="resetSimulation()">
                🔄 重置模擬
            </button>
        </div>
    </div>
</div>

<!-- 底部來源超連結 -->
<div class="footer-links">
    <a href="https://m.elsword.nexon.com/news/probability/354" target="_blank" rel="noopener noreferrer">機率來源</a>
</div>

<script>
let hkdToTwdRate = 4.1;

async function fetchExchangeRate() {
    const rateDisplay = document.getElementById('rate-display');
    try {
        const response = await fetch('https://open.er-api.com/v6/latest/HKD');
        const data = await response.json();
        
        if (data && data.rates && data.rates.TWD) {
            hkdToTwdRate = data.rates.TWD;
            rateDisplay.textContent = `(1:${hkdToTwdRate.toFixed(2)})`;
            rateDisplay.style.color = '#a0a0b0'; 
            updateStatsUI(clickCount, parseFloat(document.getElementById('total-score').textContent));
        } else {
            throw new Error("匯率資料格式錯誤");
        }
    } catch (error) {
        console.error("匯率獲取失敗:", error);
        rateDisplay.textContent = `(預設 1:${hkdToTwdRate})`;
        rateDisplay.style.color = '#d32f2f'; 
    }
}

window.onload = function() {
    fetchExchangeRate();
};

let clickCount = 0;

const options = [
    ["防具強化數值每1，物理/魔法攻擊力", 0.02, 0.2, true, 0.833],
    ["防具強化數值每1，致命一擊傷害", 0.02, 0.2, true, 0.833],
    ["防具強化數值每1，所有技能傷害", 0.02, 0.2, true, 0.834],
    ["根據攻擊時給予的傷害量的n%，在3秒內給予持續傷害", 0.1, 1, false, 6.5],
    ["物理/魔法攻擊力", 0.1, 1, false, 6.5],
    ["攻擊體力100%以下的敵人時，傷害增加", 0.1, 1, false, 6.5],
    ["兩極化：攻擊/被擊傷害", 0.1, 1, false, 6.5],
    ["致命一擊傷害", 0.1, 1, false, 6.5],
    ["給予Boss傷害增加", 0.1, 1, false, 6.5],
    ["強韌技能傷害增加", 0.1, 1, false, 6.5],
    ["強烈技能傷害增加", 0.1, 1, false, 6.5],
    ["超越技能傷害增加", 0.1, 1, false, 6.5],
    ["所有技能傷害增加", 0.1, 1, false, 6.5],
    ["致命一擊", 0.3, 1.2, false, 6.5],
    ["極大化", 0.3, 1.2, false, 6.5],
    ["無視敵人物理/魔法防禦力", 0.1, 1, false, 6.5],
    ["對一般怪物造成的傷害增加", 0.3, 1.2, false, 6.5],
    ["輔助職業恢復技能HP/MP效益增加", 0.3, 1.2, false, 6.5]
];

const scoreTable = [
    ["防具強化數值每1，物理/魔法攻擊力", 0.2, 0],
    ["防具強化數值每1，致命一擊傷害", 0.2, 0],
    ["防具強化數值每1，所有技能傷害", 0.2, 0],
    ["根據攻擊時給予的傷害量的n%，在3秒內給予持續傷害", 1, 0],
    ["物理/魔法攻擊力", 1, 0],
    ["攻擊體力100%以下的敵人時，傷害增加", 1, 0],
    ["兩極化：攻擊/被擊傷害", 1, 0],
    ["致命一擊傷害", 1, 0],
    ["給予Boss傷害增加", 1, 0],
    ["強韌技能傷害增加", 1, 0],
    ["強烈技能傷害增加", 1, 0],
    ["超越技能傷害增加", 1, 0],
    ["所有技能傷害增加", 1, 0],
    ["致命一擊", 1.2, 0],
    ["極大化", 1.2, 0],
    ["無視敵人物理/魔法防禦力", 1, 0],
    ["對一般怪物造成的傷害增加", 1, 0],
    ["輔助職業恢復技能HP/MP效益增加", 1, 0],
];

function wrapAction(action) {
    setTimeout(() => {
        action();
    }, 10);
}

function updateStatsUI(count, score) {
    document.getElementById('click-count').textContent = count;
    document.getElementById('total-score').textContent = score.toFixed(1);
    
    // 改為固定 29NT 計算
    const twd = count * 29; 
    document.getElementById('ed-twd').textContent = Math.round(twd).toLocaleString();

    const hkd = twd / hkdToTwdRate;
    document.getElementById('ed-hkd').textContent = Math.round(hkd).toLocaleString();
}

function weightedRandom(excluded = []) {
    let available = options.filter((_, i) => !excluded.includes(i));
    let totalWeight = available.reduce((sum, o) => sum + o[4], 0);
    let r = Math.random() * totalWeight;
    let cumulative = 0;
    for (let i = 0; i < available.length; i++) {
        cumulative += available[i][4];
        if (r <= cumulative) return options.indexOf(available[i]);
    }
    return options.indexOf(available[available.length - 1]);
}

function getScore(name, value) {
    // 1. 找出該屬性在計分表中的所有設定
    let candidates = scoreTable.filter(s => s[0] === name);
    if (candidates.length === 0) return 0;
    
    // 2. 篩選出「當前抽到的數值」有達到門檻的規則
    // 註：- 0.0001 是為了防止 JavaScript 浮點數計算誤差導致 0.2 不等於 0.2 的問題
    let validCandidates = candidates.filter(s => value >= s[1] - 0.0001);
    
    // 如果抽到的數值沒有達到任何門檻，就給 0 分
    if (validCandidates.length === 0) return 0;

    // 3. 如果您有設定多個門檻（例如 0.1給1分、0.2給2分），則取符合條件中最高分的那一個
    let bestMatch = validCandidates.reduce((prev, curr) => {
        return (curr[1] > prev[1]) ? curr : prev;
    });
    
    return bestMatch[2];
}

function formatOptionDisplay(name, value) {
    if (name === "武器強化數值每1，物理/魔法攻擊力等級") return `${name}+${value} Lv`;
    if (name === "物理/魔法攻擊力等級") return `${name}+${value} Lv`;
    if (name === "根據攻擊時給予的傷害量的n%，在3秒內給予持續傷害") return `${name.replace("n%", value + "%")}`;
    return `${name} : ${value}%`;
}

function generateSlotData(index) {
    let opt = options[index];
    let val;
    
    if (opt[0].startsWith("防具強化數值每1")) {
        // 第一類極品素質：從指定的 10 個數值中完全隨機抽取 (機率各 10%)
        const possibleValues = [0.02, 0.04, 0.06, 0.08, 0.10, 0.12, 0.14, 0.16, 0.18, 0.20];
        val = possibleValues[Math.floor(Math.random() * possibleValues.length)];
    } else {
        // 其他一般素質：利用整數計算來確保每個區段機率均等
        let minInt = Math.round(opt[1] * 10);
        let maxInt = Math.round(opt[2] * 10);
        let range = maxInt - minInt + 1;
        
        // 取得均等的隨機整數後，再轉回小數
        let randomInt = Math.floor(Math.random() * range) + minInt;
        val = randomInt / 10;
    }
    
    let score = getScore(opt[0], val);
    return { opt, val, score };
}

function getRandomOptions() {
    let selected = [];
    let resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '';
    let totalScore = 0;

    while (selected.length < 3) {
        let randomIndex = weightedRandom(selected);
        selected.push(randomIndex);
    }

    selected.forEach(index => {
        let { opt, val, score } = generateSlotData(index);
        totalScore += score;
        
        let div = document.createElement('div');
        div.className = "option-slot";
        
        let colorStyle = "";
        if (val === opt[1]) colorStyle = "color: var(--min-stat-color);";
        else if (val === opt[2]) colorStyle = "color: var(--max-stat-color); text-shadow: 0 0 5px rgba(211, 171, 130, 0.5);"; 
        
        div.innerHTML = `
            <span class="option-name" style="${colorStyle}">${formatOptionDisplay(opt[0], val)}</span>
            <span class="score-tag">${score} 分</span>
        `;
        resultDiv.appendChild(div);
    });

    clickCount++;
    updateStatsUI(clickCount, totalScore);
}

// 核心邏輯 - 依據填寫的目標分數進行搜尋
function findCustomTargetOptions() {
    let targetScore = parseFloat(document.getElementById('target-score').value) ;
    clickCount = 0;
    let localSearchCount = 0;
    
    while (true) {
        localSearchCount++;
        let selected = [];
        
        while (selected.length < 3) selected.push(weightedRandom(selected));

        let totalScore = 0;
        let tempHTML = "";

        selected.forEach(index => {
            let { opt, val, score } = generateSlotData(index);
            totalScore += score;

            let colorStyle = "";
            if (val === opt[1]) colorStyle = "color: var(--min-stat-color);";
            else if (val === opt[2]) colorStyle = "color: var(--max-stat-color); text-shadow: 0 0 5px rgba(211, 171, 130, 0.5);"; 

            tempHTML += `
                <div class="option-slot">
                    <span class="option-name" style="${colorStyle}">${formatOptionDisplay(opt[0], val)}</span>
                    <span class="score-tag">${score} 分</span>
                </div>`;
        });

        if (totalScore >= targetScore) {
            document.getElementById('result').innerHTML = tempHTML;
            clickCount += localSearchCount;
            updateStatsUI(clickCount, totalScore);
            break;
        }

        if (localSearchCount > 10000000) {
            alert("模擬超過 1,000 萬次仍未達成條件，請嘗試降低目標分數。");
            clickCount += localSearchCount;
            updateStatsUI(clickCount, 0);
            break;
        }
    }
}

function resetSimulation() {
    clickCount = 0;
    updateStatsUI(0, 0);
    
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = `
        <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
        <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
        <div class="option-slot"><span style="color:var(--text-sub)">尚未鑑定</span></div>
    `;
}
</script>
</body>
</html>
